[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aladin-book-mcp"
version = "0.1.0"
description = "알라딘(Aladin) OpenAPI 도서 검색 및 상세 서지·목차·원서명·중고가 수집 MCP 서버 & CLI 도구"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Yeondong Yang", email = "rubatoyd@gmail.com" }
]
keywords = ["aladin", "book", "openapi", "mcp", "search", "metadata", "literature", "toc", "used-books"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.3.0,<2",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "truststore>=0.9.0; python_version>='3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
aladin-book-mcp = "aladin_book_mcp.server:main"
aladin-book = "aladin_book_mcp.cli:cli"
aladin = "aladin_book_mcp.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aladin_book_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

