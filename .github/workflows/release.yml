name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Build sdist and wheel
      run: uv build

    - name: Set up Node for MCPB
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build MCPB extension bundle
      run: |
        npx -y @anthropic-ai/mcpb pack mcpb aladin-book-mcp.mcpb

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
          aladin-book-mcp.mcpb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
